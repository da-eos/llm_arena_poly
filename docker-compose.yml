services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmarena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmarena}
      POSTGRES_DB: ${POSTGRES_DB:-llmarena}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmarena} -d ${POSTGRES_DB:-llmarena}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-llmarena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmarena}
      POSTGRES_DB: ${POSTGRES_DB:-llmarena}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_TRACK_TOP_N: ${AUTO_TRACK_TOP_N:-10}
      AUTO_TRACK_MAX_DAYS_TO_END: ${AUTO_TRACK_MAX_DAYS_TO_END:-90}
      AUTO_TRACK_MIN_LIQUIDITY: ${AUTO_TRACK_MIN_LIQUIDITY:-10000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
